; Lilas Robotics e-ink weather station - PlatformIO build
; Uses pioarduino (community platform) because the official PlatformIO
; espressif32 platform still ships Arduino core 2.x; this firmware targets 3.x.

[platformio]
src_dir = LilasWeatherEink

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv   ; 1.9 MB app + OTA (web firmware update)
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
